name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Use disposable Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/takupoke-gradle" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          # Deliberately no cache input: nothing is saved to Actions cache storage.
      - name: Check public files and cache policy
        run: bash scripts/check-public.sh
      - name: Check screenshot log transport and corruption defenses
        run: node scripts/test-screenshot-transfer.mjs
      - name: Unit tests, Android lint, debug and optimized release builds
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --no-build-cache -Dorg.gradle.jvmargs=-Xmx3g
      - name: Test summary
        if: always()
        run: bash scripts/test-summary.sh
      - name: Remove job-local build data
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf -- "$RUNNER_TEMP/takupoke-gradle" app/build core/build .gradle
  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - name: Use disposable Gradle home
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/takupoke-gradle" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Synthetic document, storage, authentication and screen tests
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --no-build-cache -Dorg.gradle.jvmargs=-Xmx3g
      - name: Test summary
        if: always()
        run: bash scripts/test-summary.sh
      - name: Remove job-local build data
        if: always()
        run: |
          ./gradlew --stop || true
          rm -rf -- "$RUNNER_TEMP/takupoke-gradle" app/build core/build .gradle
